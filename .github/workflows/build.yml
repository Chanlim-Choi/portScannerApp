name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test

  ios-app:
    name: iOS app (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app

      # Builds with the runner's default Xcode, and also with the newest
      # Xcode 26 when the runner has one, for the iPhone (device) SDK.
      # Signing is turned off: on the Mac you sign with your own Personal Team.
      - name: Build for iPhone
        run: |
          set -euo pipefail
          default_dir="$(xcode-select -p)"
          xcodes=("$default_dir")
          newest_26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | tail -1 || true)"
          if [ -n "$newest_26" ] && [ "$newest_26/Contents/Developer" != "$default_dir" ]; then
            xcodes+=("$newest_26/Contents/Developer")
          fi
          for dir in "${xcodes[@]}"; do
            echo "::group::$(DEVELOPER_DIR="$dir" xcodebuild -version | head -1) ($dir)"
            DEVELOPER_DIR="$dir" xcodebuild \
              -project PortScanner.xcodeproj \
              -target PortScanner \
              -configuration Debug \
              -sdk iphoneos \
              SYMROOT="$RUNNER_TEMP/build-$(basename "$(dirname "$(dirname "$dir")")")" \
              CODE_SIGNING_ALLOWED=NO \
              build
            echo "::endgroup::"
          done
